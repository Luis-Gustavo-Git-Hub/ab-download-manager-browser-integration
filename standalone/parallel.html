<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Downloads</title><link rel="stylesheet" href="manager.css"><body><main><h1>Downloads</h1><p>Cole o link direto do arquivo e toque em Baixar. O Chrome pedirá permissão para acessar esse site.</p><label for="url">Link do arquivo</label><input id="url" type="url" placeholder="https://..." required><button id="inspect">Baixar</button><button id="start" hidden>Retomar download</button><button id="pause" hidden>Pausar</button><button id="save" hidden>Salvar arquivo</button><button id="discard" hidden>Cancelar e limpar</button><p id="status" role="status"></p><progress id="progress" aria-label="Bytes confirmados"></progress><p>O download continua mesmo se você fechar este popup. A extensão baixa em paralelo quando o servidor permite; se não permitir, o Chrome inicia o modo padrão.</p><a href="manager.html">Modo padrão</a></main><script src="parallel-engine.js"></script><script src="parallel-ui.js"></script></body></html>
