<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Download paralelo</title><link rel="stylesheet" href="manager.css"><body><main><h1>Downloads</h1><p>Cole o link direto do arquivo e toque em Baixar. O Chrome pedirá permissão para acessar sites. Mantenha o popup aberto enquanto baixa em paralelo.</p><label for="url">Link do arquivo</label><input id="url" type="url" placeholder="https://..." required><button id="inspect">Baixar</button><button id="start" disabled>Retomar download</button><button id="pause" hidden>Pausar</button><button id="save" disabled>Salvar arquivo</button><button id="discard" hidden>Cancelar e limpar</button><p id="status" role="status"></p><progress id="progress" aria-label="Bytes confirmados"></progress><p>A extensão tenta baixar em paralelo quando o servidor permite. Se não permitir, inicia o download padrão do Chrome.</p><a href="manager.html">Modo padrão</a></main><script src="parallel-engine.js"></script><script src="parallel-ui.js"></script></body></html>
